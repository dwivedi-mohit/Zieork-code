<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting Zieork...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #f3f4f6;
      overflow: hidden;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 16px;
    }
    .logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: linear-gradient(135deg, #38bdf8, #a855f7, #f59e0b);
      filter: blur(20px);
      opacity: 0.6;
      animation: pulse 2.5s infinite alternate ease-in-out;
    }
    .logo-icon {
      position: relative;
      font-size: 52px;
      z-index: 2;
      filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.8));
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .progress-bar-container {
      width: 260px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8);
      border-radius: 999px;
      animation: sweep 1.8s infinite ease-in-out;
    }
    .status-text {
      font-size: 12px;
      color: #a5b4fc;
      font-family: 'JetBrains Mono', monospace, sans-serif;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.95); }
      100% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes sweep {
      0% { left: -40%; width: 40%; }
      50% { width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-glow"></div>
    <div class="logo-icon">⚡</div>
  </div>
  <div class="title">ZIEORK</div>
  <div class="subtitle">Autonomous Neural Intelligence</div>
  <div class="progress-bar-container">
    <div class="progress-bar-fill"></div>
  </div>
  <div id="status" class="status-text">Connecting to Edge Core...</div>
</body>
</html>
